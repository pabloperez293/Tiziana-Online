<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tiziana - Tienda de Frutas y Verduras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <header class="header">
    <div class="logo-container">
      <img src="assets/logo.png" alt="Tiziana Logo">
      <h1>TIZIANA</h1>
    </div>
    <div class="cart-icon" onclick="toggleCart()">
      🛒 <span id="cart-count">0</span>
    </div>
  </header>

  <section class="banner">
    <h2>Precios actualizados semanalmente</h2>
    <p>Coordinamos entregas en Partido de 3 de Febrero</p>
  </section>

  <section class="search-section">
    <input type="text" id="searchInput" placeholder="Buscar productos..." onkeyup="filterProducts()">
  </section>

  <section class="products" id="products-container">
    <!-- Productos cargados por JS -->
  </section>

  <!-- CARRITO -->
  <div class="cart" id="cart">
    <h3>Tu Pedido</h3>
    <div id="cart-items"></div>
    <div class="cart-total">
      Total: $<span id="cart-total">0</span>
    </div>
    <button onclick="checkout()">Finalizar por WhatsApp</button>
  </div>

  <footer>
    <p>📍 3 de Febrero | 📲 11 3823 0491</p>
    <p>Distribuidora Tiziana</p>
  </footer>

  <script src="./js/main.js"></script>
</body>
</html>
